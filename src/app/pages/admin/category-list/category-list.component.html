<div class="row">
    <div class="col-12 col-md-4 add-button pt-2">
        <button type="button" class="btn btn-sm btn-outline-success" (click)="openAddCategory()"><i
                class="fas fa-plus"></i>
            {{ 'Add Category' | translate }}</button>
    </div>
    <div class="col-12 col-md-4 ml-auto text-right pr-2">
        <mat-form-field>
            <mat-label>{{ 'Search' | translate }}</mat-label>
            <input matInput type="text" [(ngModel)]="searchText" (keypress)="paginationConfig.currentPage = 1"
                placeholder="{{ 'Enter Words for Search' | translate }}" name="SearchText">
            <a type="button" matSuffix [attr.aria-label]="'Search'">
                <mat-icon>search</mat-icon>
            </a>
        </mat-form-field>
    </div>
</div>
<div class="card">
    <div class="card-body table-responsive p-0">
        <table class="table table-hover table-striped">
            <thead>
                <tr>
                    <th>{{ 'Category Name' | translate }}</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let category of categories | filter:searchText | paginate: paginationConfig">
                    <td> {{ category.CategoryName}} </td>
                    <td class="list-button text-right">
                        <a mat-icon-button [matMenuTriggerFor]="menu">
                            <mat-icon class="list-menu">more_vert</mat-icon>
                        </a>
                        <mat-menu #menu="matMenu">
                            <a mat-menu-item (click)="openAddCategory(category.Id)">
                                <mat-icon>edit</mat-icon>
                                <span>{{ 'Edit' | translate }}</span>
                            </a>
                            <a mat-menu-item (click)="categoryDelete(category.Id)">
                                <mat-icon>delete</mat-icon>
                                <span>{{ 'Delete' | translate }}</span>
                            </a>
                        </mat-menu>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
<app-pagination [config]="paginationConfig"></app-pagination>
