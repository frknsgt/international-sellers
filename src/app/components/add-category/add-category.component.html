<div ma-dialog-title class="institution-dialog__header">
    <div class="institution-dialog__modal-header d-flex justify-content-between mx-1">
        <h2>{{ "Category Transactions" | translate }}</h2>
        <a [mat-dialog-close]="false" class="close-icon">
            <mat-icon>close</mat-icon>
        </a>
    </div>
</div>
<mat-dialog-content class="mat-typography institution-dialog__content">
    <form #addCategoryForm="ngForm" (ngSubmit)="onSave(addCategoryForm)">
        <div class="form-group mt-2">
            <mat-form-field appearance="outline" class="w-100">
                <mat-label>{{ "Category Name" | translate }}</mat-label>
                <input matInput maxlength="50" type="text" placeholder="{{ 'Enter Category Name' | translate }}"
                    name="CategoryName" #CategoryName="ngModel" [(ngModel)]="_model.CategoryName" required />
                <mat-error *ngIf="CategoryName.invalid && CategoryName.touched">
                    {{ "Category Name field must be filled" | translate }}</mat-error>
            </mat-form-field>
        </div>
        <div class="form-group">
            <button type="submit" class="btn btn-primary w-100" [disabled]="disableButton">
                {{ "Save" | translate }}
            </button>
        </div>
    </form>
</mat-dialog-content>
